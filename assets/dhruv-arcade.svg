<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Dhruv Khanna — Developer Arcade</title>
<desc id="desc">A dark arcade-inspired animated developer profile banner in violet, cyan and acid lime.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#090D1B"/><stop offset=".55" stop-color="#171638"/><stop offset="1" stop-color="#092B38"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9B8CFF"/><stop offset=".55" stop-color="#38D9F5"/><stop offset="1" stop-color="#C7F464"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#8290C8" stroke-opacity=".12" stroke-width="1"/>
  </pattern>
</defs>
<rect width="1200" height="390" rx="26" fill="url(#bg)"/>
<rect width="1200" height="390" rx="26" fill="url(#grid)"/>
<path d="M0 315 Q250 255 480 330 T930 305 T1200 285" fill="none" stroke="#38D9F5" stroke-opacity=".15" stroke-width="2"/>
<g fill="#C7F464" opacity=".8">
  <circle cx="88" cy="75" r="2"/><circle cx="1030" cy="62" r="2"/><circle cx="1090" cy="280" r="2"/>
  <circle cx="730" cy="45" r="2"/><circle cx="520" cy="345" r="2"/>
</g>
<g font-family="monospace" font-size="13" fill="#A7B0D2" opacity=".8">
  <text x="54" y="48">DH-KH / SYSTEM PROFILE</text>
  <text x="930" y="48">PLAYER 01  •  ONLINE</text>
</g>
<g transform="translate(70 105)">
  <rect x="0" y="0" width="680" height="210" rx="18" fill="#080D1A" stroke="#38D9F5" stroke-opacity=".55"/>
  <path d="M0 42H680" stroke="#38D9F5" stroke-opacity=".25"/>
  <circle cx="24" cy="21" r="5" fill="#FF6B8A"/><circle cx="43" cy="21" r="5" fill="#C7F464"/><circle cx="62" cy="21" r="5" fill="#38D9F5"/>
  <text x="88" y="26" font-family="monospace" font-size="12" fill="#8793B8">dhruv@dev-arcade:~</text>
  <text x="34" y="100" font-family="monospace" font-weight="700" font-size="48" fill="#F4F5FF">DHRUV KHANNA</text>
  <rect x="36" y="120" width="420" height="3" rx="2" fill="url(#neon)"/>
  <text x="36" y="157" font-family="monospace" font-size="17" fill="#38D9F5">SOFTWARE ENGINEER</text>
  <text x="36" y="184" font-family="monospace" font-size="13" fill="#B7BED8">BACKEND SYSTEMS  /  APPLIED AI  /  ANALYTICS</text>
  <rect x="471" y="145" width="10" height="20" fill="#C7F464">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</g>
<g transform="translate(835 115)" filter="url(#glow)">
  <rect x="0" y="0" width="280" height="170" rx="18" fill="#10152A" stroke="#9B8CFF" stroke-width="2"/>
  <text x="22" y="30" font-family="monospace" font-size="12" fill="#9B8CFF">QUEST SELECT</text>
  <g font-family="monospace" font-size="14" fill="#E8EAF6">
    <text x="24" y="66">▶ BUILD</text><text x="24" y="98">▶ EXPLORE AI</text><text x="24" y="130">▶ SHIP &amp; REPEAT</text>
  </g>
  <path d="M210 54l18 18-18 18-18-18z" fill="none" stroke="#C7F464" stroke-width="2">
    <animateTransform attributeName="transform" type="rotate" from="0 210 72" to="360 210 72" dur="12s" repeatCount="indefinite"/>
  </path>
</g>
<g fill="none" stroke="url(#neon)" stroke-width="2" opacity=".8">
  <circle cx="1030" cy="325" r="24"><animate attributeName="r" values="20;27;20" dur="3s" repeatCount="indefinite"/></circle>
  <path d="M1018 325h24m-12-12v24"/>
  <path d="M795 65l10-18 10 18z"><animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="4s" repeatCount="indefinite"/></path>
</g>
<text x="70" y="355" font-family="monospace" font-size="12" fill="#8F9ABF">IIIT GWALIOR  •  BENGALURU, INDIA  •  PRESS START TO EXPLORE</text>
</svg>